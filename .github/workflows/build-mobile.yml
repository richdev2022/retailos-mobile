name: Build Mobile (Android APK + AAB)

# =====================================================================
# Required GitHub Actions secrets (configure in repo settings -> secrets):
#   ANDROID_KEYSTORE_BASE64   — base64-encoded .jks keystore file
#   ANDROID_KEYSTORE_PASSWORD — keystore file password
#   ANDROID_KEY_ALIAS         — alias of the signing key inside the keystore
#   ANDROID_KEY_PASSWORD      — password for the signing key
#
# To create a keystore locally:
#   keytool -genkey -v -keystore retailos.jks \
#     -keyalg RSA -keysize 2048 -validity 10000 \
#     -alias retailos
# Then encode for GitHub Actions:
#   base64 -i retailos.jks | pbcopy  # macOS
#   base64 -w 0 retailos.jks          # Linux
# =====================================================================

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0). If set, a GitHub Release will be created.'
        required: false
        type: string
        default: ''

jobs:
  build-android:
    name: Build signed APK + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      # ----------------------------------------------------------------
      # Signing setup. If secrets are missing we build an unsigned
      # debug variant so the workflow still validates the build.
      # ----------------------------------------------------------------
      - name: Decode keystore from secrets
        id: keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "Decoding keystore..."
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/retailos.jks
          echo "keystore-path=android/app/retailos.jks" >> $GITHUB_OUTPUT
          echo "Keystore decoded."

      - name: Write key.properties
        if: ${{ steps.keystore.outputs.keystore-path != '' }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storeFile=retailos.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          echo "key.properties written."

      - name: Build release APK
        run: flutter build apk --release --flavor prod -t lib/main.dart --no-tree-shake-icons

      - name: Build release AAB (App Bundle for Play Store)
        run: flutter build appbundle --release --flavor prod -t lib/main.dart --no-tree-shake-icons

      - name: Verify APK signature
        if: ${{ steps.keystore.outputs.keystore-path != '' }}
        run: |
          BUILD_TOOLS=$(ls -1 $ANDROID_HOME/build-tools | sort -V | tail -1)
          apksigner verify --verbose --print-certs build/app/outputs/flutter-apk/app-prod-release.apk | head -30

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: retailos-android-apk
          path: build/app/outputs/flutter-apk/app-prod-release.apk
          retention-days: 90
          if-no-files-found: error

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: retailos-android-aab
          path: build/app/outputs/bundle/prodRelease/app-prod-release.aab
          retention-days: 90
          if-no-files-found: error

      - name: Create GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.version != '' && github.ref == 'refs/heads/main' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/app-prod-release.apk
            build/app/outputs/bundle/prodRelease/app-prod-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
